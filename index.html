<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awan Fashion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="store-logo">AF</div>
        <h1>Awan Fashion</h1>
        <p>Style That Defines You</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
        <span>🛒 Cart: <span id="cart-count">0</span></span>
    </nav>

    <main id="home">
        <h2>Our Products</h2>

        <section id="products" class="products">
            <div class="product">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="T-Shirt">
                <h3>T-Shirt</h3>
                <p>Price: Rs. 1500</p>
                <button onclick="addToCart('T-Shirt', 1500)">Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">
                <h3>Shoes</h3>
                <p>Price: Rs. 3000</p>
                <button onclick="addToCart('Shoes', 3000)">Add to Cart</button>
            </div>
        </section>
    </section>

    <section id="cart-section">
        <h2>My Shopping Cart</h2>
        <ul id="cart-items"></ul>
        <h3>Total: Rs. <span id="total-price">0</span></h3>
    </section>
    <section id="checkout">
        <h2>Checkout</h2>
    
        <form id="checkout-form">
            <label for="customer-name">Full Name</label>
            <input type="text" id="customer-name"
                   placeholder="Enter your full name" required>
    
            <label for="customer-phone">Phone Number</label>
            <input type="tel" id="customer-phone"
                   placeholder="Enter your phone number" required>
    
            <label for="customer-address">Delivery Address</label>
            <textarea id="customer-address"
                      placeholder="Enter your full address"
                      required></textarea>
    
            <button type="submit">Place Order <label for="payment-method">Payment Method:</label>
                <select id="payment-method" required>
                    <option value="cod">Cash on Delivery (COD)</option>
                </select></button>
        </form>
    
        <p id="order-message"></p>
    </section>
    
    </main>

    <footer id="contact">
        <p>Contact us to place your order.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
